services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
      # Keep node_modules inside the container — native deps differ from macOS.
      - node_modules:/workspaces/PickleEvents/node_modules
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://pickle:pickle@db:5432/pickle?schema=public
      AUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    network_mode: service:db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pickle
      POSTGRES_PASSWORD: pickle
      POSTGRES_DB: pickle
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pickle -d pickle']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
  node_modules:
