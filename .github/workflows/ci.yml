name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pickle
          POSTGRES_PASSWORD: pickle
          POSTGRES_DB: pickle
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pickle -d pickle"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://pickle:pickle@localhost:5432/pickle?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret
      AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Schema is valid
        run: npx prisma validate

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      # The build only needs these to exist, not to resolve.
      DATABASE_URL: postgresql://pickle:pickle@localhost:5432/pickle?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
