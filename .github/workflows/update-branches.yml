name: Update open PR branches

# main requires a branch to be up to date before it merges, and GitHub's
# auto-merge does not update the branch for you. After every push to main this
# merges main into each open PR, which re-runs CI and lets auto-merge fire.
# A PR that is opened already behind main (its branch came off a stale main)
# would otherwise wait for an unrelated merge, so opening one updates that PR
# straight away.
#
# It needs a fine-grained personal access token in the PR_UPDATE_TOKEN secret:
# pushes made with the built-in GITHUB_TOKEN do not trigger workflows, so the
# checks would never re-run and the PR would sit at "expected".

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-branches
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Merge main into every open PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN }}
      REPO: ${{ github.repository }}
      # Set only when a pull request opened this run; empty on a push to main.
      OPENED_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check the token is set
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PR_UPDATE_TOKEN is not set. Add a fine-grained PAT with Contents, Pull requests and Workflows read/write on this repo."
            exit 1
          fi

      - name: Update each open pull request
        run: |
          set -u
          failed=0
          if [ -n "$OPENED_PR" ]; then
            numbers=$OPENED_PR
          else
            numbers=$(gh pr list --repo "$REPO" --base main --state open --json number,isDraft \
              --jq '.[] | select(.isDraft | not) | .number')
          fi
          if [ -z "$numbers" ]; then
            echo "No open pull requests to update."
            exit 0
          fi
          for n in $numbers; do
            out=$(gh api -X PUT "repos/$REPO/pulls/$n/update-branch" 2>&1) && {
              echo "#$n: updating branch"
              continue
            }
            case "$out" in
              *"no new commits"*)
                echo "#$n: already up to date" ;;
              *onflict*)
                echo "::warning::#$n has a merge conflict and was not updated" ;;
              *)
                echo "::error::#$n: $out"
                failed=1 ;;
            esac
          done
          exit $failed
